permissions:
  contents: read

name: main-workflow

on:
  push:
    branches: [ main, 'sprint/**', 'release/**', 'topic/RDK*', 'feature/**', develop ]
  pull_request:
    branches: [ main, 'sprint/**', 'release/**', 'topic/RDK*', develop ]

jobs:
  trigger-L1:
    uses: ./.github/workflows/L1-tests.yml
    with:
      caller_source: local

  trigger-L2:
    uses: ./.github/workflows/L2-tests.yml
    with:
      caller_source: local
